name: GradeDraft CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: GradeDraft.xcodeproj
  SCHEME: GradeDraft
  IOS_MIN_MAJOR: "26"
  XCODE_MIN_MAJOR: "26"

jobs:
  static-policy:
    name: static-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Print Python version
        run: python3 --version

      - name: Repository health check
        run: python3 scripts/repo_health.py

      - name: No-network guardrail
        run: python3 scripts/no_network_scan.py

      - name: Export-hardening guardrail
        run: python3 scripts/export_hardening_scan.py

      - name: Bad implementation string guardrail
        run: python3 scripts/ci/bad_string_scan.py

      - name: Native UI refactor guardrail
        run: python3 scripts/ci/check_native_ui_refactor.py

      - name: Route and export truthfulness guardrail
        run: python3 scripts/ci/check_route_and_export_truthfulness.py

      - name: Xcode project membership guardrail
        run: python3 scripts/ci/check_xcode_project_membership.py

      - name: Curriculum generator check
        run: python3 scripts/curriculum/build_acara_curriculum_catalog.py --check

      - name: Curriculum catalog validator
        run: python3 scripts/ci/check_curriculum_catalog.py

      - name: CI contract guardrail
        run: python3 scripts/ci/check_ci_contract.py

      - name: Production static readiness guardrail
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: python3 scripts/ci/check_release_readiness_static.py

      - name: Plist parse guardrail
        run: |
          python3 - <<'PY'
          import plistlib
          for path in ["GradeDraft/Resources/Info.plist", "GradeDraft/Resources/PrivacyInfo.xcprivacy"]:
              with open(path, "rb") as handle:
                  plistlib.load(handle)
              print(f"plist OK: {path}")
          PY

      - name: Write static policy summary
        if: always()
        run: |
          {
            echo "## static-policy"
            echo ""
            echo "- Python: $(python3 --version)"
            echo "- Guardrails: repo_health, no_network_scan, export_hardening_scan, bad_string_scan, native_ui_refactor, route_export_truthfulness, project_membership, CI contract"
            echo "- Release readiness: explicit manual/scheduled gate via scripts/ci/check_release_readiness_static.py"
            echo "- Local reproduction:"
            echo "  \`python3 scripts/repo_health.py && python3 scripts/no_network_scan.py && python3 scripts/export_hardening_scan.py && python3 scripts/ci/bad_string_scan.py && python3 scripts/ci/check_native_ui_refactor.py && python3 scripts/ci/check_route_and_export_truthfulness.py && python3 scripts/ci/check_xcode_project_membership.py && python3 scripts/ci/check_ci_contract.py\`"
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflow syntax
        run: actionlint .github/workflows/*.yml

      - name: Validate GradeDraft CI contract
        run: python3 scripts/ci/check_ci_contract.py

      - name: Write workflow lint summary
        if: always()
        run: |
          {
            echo "## workflow-lint"
            echo ""
            echo "- Tool: actionlint v1.7.7"
            echo "- Contract: scripts/ci/check_ci_contract.py"
            echo "- Local reproduction: \`actionlint .github/workflows/*.yml && python3 scripts/ci/check_ci_contract.py\`"
          } >> "$GITHUB_STEP_SUMMARY"

  swiftlint:
    name: swiftlint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: bash scripts/ci/select_xcode.sh

      - name: Install SwiftLint only if missing
        run: |
          set -euo pipefail
          if command -v swiftlint >/dev/null 2>&1; then
            echo "Using preinstalled SwiftLint."
          else
            echo "SwiftLint is not preinstalled; installing with Homebrew."
            brew install swiftlint
          fi

      - name: Print tool versions
        run: |
          xcodebuild -version
          swiftlint version

      - name: SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      - name: Write SwiftLint summary
        if: always()
        run: |
          {
            echo "## swiftlint"
            echo ""
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- SwiftLint: $(swiftlint version 2>/dev/null || echo unavailable)"
            echo "- Local reproduction: \`bash scripts/ci/select_xcode.sh && swiftlint lint --config .swiftlint.yml --reporter github-actions-logging\`"
          } >> "$GITHUB_STEP_SUMMARY"

  xcode-unit-tests:
    name: xcode-unit-tests
    runs-on: macos-26
    needs: [static-policy, workflow-lint, swiftlint]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: bash scripts/ci/select_xcode.sh

      - name: Print Xcode, SDK, and simulator inventory
        run: |
          set -euo pipefail
          mkdir -p xcode-logs
          xcodebuild -version | tee xcode-logs/xcode-version.log
          xcodebuild -showsdks | tee xcode-logs/xcode-sdks.log
          xcrun simctl list runtimes available | tee xcode-logs/sim-runtimes.log
          xcrun simctl list devices available | tee xcode-logs/sim-devices.log

      - name: Select iOS 26+ iPhone simulator
        id: simulator
        run: python3 scripts/ci/select_ios_simulator.py

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode26-${{ hashFiles('GradeDraft.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26-

      - name: Reset derived SwiftPM workspace state
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/SourcePackages"
          rm -rf "$RUNNER_TEMP/GradeDraftSourcePackages"
          mkdir -p "$RUNNER_TEMP/GradeDraftSourcePackages"

      - name: Diagnose Xcode project package metadata
        run: |
          set -euo pipefail
          /usr/bin/plutil -lint GradeDraft.xcodeproj/project.pbxproj
          /usr/bin/plutil -convert json -o "$RUNNER_TEMP/project.pbxproj.json" GradeDraft.xcodeproj/project.pbxproj
          find GradeDraft.xcodeproj -name Package.resolved -print -exec wc -c {} \; -exec sed -n '1,40p' {} \; || true

      - name: Resolve Swift package dependencies
        run: |
          set -euo pipefail
          mkdir -p xcode-logs
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/GradeDraftSourcePackages" \
            | tee xcode-logs/spm-resolve.log

      - name: Build and run deterministic unit/integration tests
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/GradeDraftDerivedData"
          RESULT_BUNDLE="$RUNNER_TEMP/GradeDraftUnitTests.xcresult"
          mkdir -p xcode-logs
          rm -rf "$RESULT_BUNDLE"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/GradeDraftSourcePackages" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -skip-testing:GradeDraftTests/GradeDraftScreenshotTests \
            -skip-testing:GradeDraftUITests \
            ARCHS=arm64 \
            clean test \
            | tee xcode-logs/xcode-unit-tests.log

      - name: Upload unit-test result bundle and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-unit-tests-output
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/GradeDraftUnitTests.xcresult
            xcode-logs/*.log

      - name: Write unit-test summary
        if: always()
        run: |
          {
            echo "## xcode-unit-tests"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Xcode | $(xcodebuild -version | head -1) |"
            echo "| Simulator | ${{ steps.simulator.outputs.device_name }} (${{ steps.simulator.outputs.runtime_name }}) |"
            echo "| Destination | ${{ steps.simulator.outputs.destination }} |"
            echo "| Result bundle | ${{ runner.temp }}/GradeDraftUnitTests.xcresult |"
            echo "| Command | \`xcodebuild -project $PROJECT -scheme $SCHEME -destination '${{ steps.simulator.outputs.destination }}' -derivedDataPath \$RUNNER_TEMP/GradeDraftDerivedData -resultBundlePath \$RUNNER_TEMP/GradeDraftUnitTests.xcresult -skip-testing:GradeDraftTests/GradeDraftScreenshotTests -skip-testing:GradeDraftUITests ARCHS=arm64 clean test\` |"
            echo ""
            echo "Local reproduction:"
            echo "\`\`\`bash"
            echo "bash scripts/ci/select_xcode.sh"
            echo "DESTINATION=\"\$(python3 scripts/ci/select_ios_simulator.py --print-destination)\""
            echo "xcodebuild -project GradeDraft.xcodeproj -scheme GradeDraft -destination \"\$DESTINATION\" -derivedDataPath /tmp/GradeDraftDerivedData -resultBundlePath /tmp/GradeDraftUnitTests.xcresult -skip-testing:GradeDraftTests/GradeDraftScreenshotTests -skip-testing:GradeDraftUITests ARCHS=arm64 clean test"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  screenshot-smoke:
    name: screenshot-smoke
    runs-on: macos-26
    needs: xcode-unit-tests
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-check'))
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: bash scripts/ci/select_xcode.sh

      - name: Select iOS 26+ iPhone simulator
        id: simulator
        run: python3 scripts/ci/select_ios_simulator.py

      - name: Reset derived SwiftPM workspace state
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/SourcePackages"
          rm -rf "$RUNNER_TEMP/GradeDraftSourcePackages"
          mkdir -p "$RUNNER_TEMP/GradeDraftSourcePackages"

      - name: Run screenshot smoke tests only
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/GradeDraftScreenshotDerivedData"
          RESULT_BUNDLE="$RUNNER_TEMP/GradeDraftScreenshotTests.xcresult"
          mkdir -p xcode-logs screenshots
          rm -rf "$RESULT_BUNDLE"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/GradeDraftSourcePackages" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:GradeDraftTests/GradeDraftScreenshotTests \
            ARCHS=arm64 \
            test \
            | tee xcode-logs/xcode-screenshot-smoke.log

      - name: Collect screenshot PNGs from simulator container
        if: always()
        env:
          DERIVED_DATA: ${{ runner.temp }}/GradeDraftScreenshotDerivedData
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -euo pipefail
          mkdir -p screenshots
          UDID="${DESTINATION##*id=}"
          UDID="${UDID%%,*}"
          APP_PATH="$(find "$DERIVED_DATA" -path '*/Build/Products/*/*.app' -type d | head -n 1 || true)"
          if [ -z "$UDID" ] || [ -z "$APP_PATH" ]; then
            echo "Missing simulator UDID or built app; screenshot extraction cannot proceed."
            exit 0
          fi
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist" 2>/dev/null || true)"
          if [ -z "$BUNDLE_ID" ]; then
            echo "Missing bundle ID; screenshot extraction cannot proceed."
            exit 0
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          APP_CONTAINER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)"
          if [ -n "$APP_CONTAINER" ] && [ -d "$APP_CONTAINER/Documents/GradeDraftScreenshots" ]; then
            cp "$APP_CONTAINER/Documents/GradeDraftScreenshots"/*.png screenshots/ 2>/dev/null || true
          fi
          if ! ls screenshots/*.png >/dev/null 2>&1; then
            SIM_DATA="${HOME}/Library/Developer/CoreSimulator/Devices/$UDID/data"
            FOUND_DIR="$(find "$SIM_DATA/Containers/Data/Application" -name GradeDraftScreenshots -type d 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_DIR" ]; then
              cp "$FOUND_DIR"/*.png screenshots/ 2>/dev/null || true
            fi
          fi
          ls -la screenshots || true

      - name: Upload screenshot result bundle and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-screenshot-smoke-output
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/GradeDraftScreenshotTests.xcresult
            xcode-logs/xcode-screenshot-smoke.log

      - name: Upload screenshot PNG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradedraft-screenshots
          retention-days: 30
          if-no-files-found: warn
          path: screenshots/*.png

      - name: Write screenshot summary
        if: always()
        run: |
          {
            echo "## screenshot-smoke"
            echo ""
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- Simulator: ${{ steps.simulator.outputs.device_name }} (${{ steps.simulator.outputs.runtime_name }})"
            echo "- PNG count: $(find screenshots -maxdepth 1 -name '*.png' -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo "- Result bundle: ${{ runner.temp }}/GradeDraftScreenshotTests.xcresult"
            echo "- Local reproduction: \`bash scripts/ci/select_xcode.sh && DESTINATION=\"\$(python3 scripts/ci/select_ios_simulator.py --print-destination)\" && xcodebuild -project GradeDraft.xcodeproj -scheme GradeDraft -destination \"\$DESTINATION\" -derivedDataPath /tmp/GradeDraftScreenshotDerivedData -resultBundlePath /tmp/GradeDraftScreenshotTests.xcresult -only-testing:GradeDraftTests/GradeDraftScreenshotTests ARCHS=arm64 test\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ui-smoke:
    name: ui-smoke
    runs-on: macos-26
    needs: xcode-unit-tests
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: bash scripts/ci/select_xcode.sh

      - name: Select iOS 26+ iPhone simulator
        id: simulator
        run: python3 scripts/ci/select_ios_simulator.py

      - name: Reset derived SwiftPM workspace state
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/SourcePackages"
          rm -rf "$RUNNER_TEMP/GradeDraftSourcePackages"
          mkdir -p "$RUNNER_TEMP/GradeDraftSourcePackages"

      - name: Run app-driving UI smoke test
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/GradeDraftUISmokeDerivedData"
          RESULT_BUNDLE="$RUNNER_TEMP/GradeDraftUISmoke.xcresult"
          mkdir -p xcode-logs
          rm -rf "$RESULT_BUNDLE"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/GradeDraftSourcePackages" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:GradeDraftUITests/GradeDraftCoreLaneUITests \
            ARCHS=arm64 \
            test \
            | tee xcode-logs/xcode-ui-smoke.log

      - name: Upload UI smoke result bundle and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-ui-smoke-output
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/GradeDraftUISmoke.xcresult
            xcode-logs/xcode-ui-smoke.log

      - name: Write UI smoke summary
        if: always()
        run: |
          {
            echo "## ui-smoke"
            echo ""
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- Simulator: ${{ steps.simulator.outputs.device_name }} (${{ steps.simulator.outputs.runtime_name }})"
            echo "- Result bundle: ${{ runner.temp }}/GradeDraftUISmoke.xcresult"
            echo "- Local reproduction: \`bash scripts/ci/select_xcode.sh && DESTINATION=\"\$(python3 scripts/ci/select_ios_simulator.py --print-destination)\" && xcodebuild -project GradeDraft.xcodeproj -scheme GradeDraft -destination \"\$DESTINATION\" -derivedDataPath /tmp/GradeDraftUISmokeDerivedData -resultBundlePath /tmp/GradeDraftUISmoke.xcresult -only-testing:GradeDraftUITests/GradeDraftCoreLaneUITests ARCHS=arm64 test\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-build:
    name: release-build
    runs-on: macos-26
    needs: xcode-unit-tests
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: bash scripts/ci/select_xcode.sh

      - name: Reset derived SwiftPM workspace state
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/SourcePackages"
          rm -rf "$RUNNER_TEMP/GradeDraftSourcePackages"
          mkdir -p "$RUNNER_TEMP/GradeDraftSourcePackages"

      - name: Build Release without signing
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/GradeDraftReleaseDerivedData"
          mkdir -p xcode-logs
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/GradeDraftSourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | tee xcode-logs/xcode-release-build.log

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-release-build-output
          retention-days: 30
          if-no-files-found: warn
          path: xcode-logs/xcode-release-build.log

      - name: Write release summary
        if: always()
        run: |
          {
            echo "## release-build"
            echo ""
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- Destination: generic/platform=iOS"
            echo "- Command: \`xcodebuild -project $PROJECT -scheme $SCHEME -configuration Release -destination generic/platform=iOS -derivedDataPath \$RUNNER_TEMP/GradeDraftReleaseDerivedData CODE_SIGNING_ALLOWED=NO build\`"
            echo "- Local reproduction: \`bash scripts/ci/select_xcode.sh && xcodebuild -project GradeDraft.xcodeproj -scheme GradeDraft -configuration Release -destination generic/platform=iOS -derivedDataPath /tmp/GradeDraftReleaseDerivedData CODE_SIGNING_ALLOWED=NO build\`"
          } >> "$GITHUB_STEP_SUMMARY"

  unsigned-archive-validation:
    name: unsigned-archive-validation
    runs-on: macos-26
    needs: xcode-unit-tests
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: bash scripts/ci/select_xcode.sh

      - name: Reset derived SwiftPM workspace state
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/SourcePackages"
          rm -rf "$RUNNER_TEMP/GradeDraftSourcePackages"
          mkdir -p "$RUNNER_TEMP/GradeDraftSourcePackages"

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" -clonedSourcePackagesDirPath "$RUNNER_TEMP/GradeDraftSourcePackages"

      - name: Unsigned archive build gate
        run: |
          set -euo pipefail
          mkdir -p xcode-logs
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GradeDraft.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/GradeDraftSourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            | tee xcode-logs/xcode-unsigned-archive.log

      - name: Upload unsigned archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-unsigned-archive-output
          retention-days: 30
          if-no-files-found: warn
          path: xcode-logs/xcode-unsigned-archive.log


  ci-summary:
    name: ci-summary
    runs-on: ubuntu-latest
    needs: [static-policy, workflow-lint, swiftlint, xcode-unit-tests, screenshot-smoke, ui-smoke, release-build, unsigned-archive-validation]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Write combined CI summary
        run: |
          {
            echo "## GradeDraft CI summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| static-policy | ${{ needs.static-policy.result }} |"
            echo "| workflow-lint | ${{ needs.workflow-lint.result }} |"
            echo "| swiftlint | ${{ needs.swiftlint.result }} |"
            echo "| xcode-unit-tests | ${{ needs.xcode-unit-tests.result }} |"
            echo "| screenshot-smoke | ${{ needs.screenshot-smoke.result }} |"
            echo "| ui-smoke | ${{ needs.ui-smoke.result }} |"
            echo "| release-build | ${{ needs.release-build.result }} |"
            echo "| unsigned-archive-validation | ${{ needs.unsigned-archive-validation.result }} |"
            echo ""
            echo "Required for PR merge: static-policy, workflow-lint, swiftlint, xcode-unit-tests, ui-smoke."
            echo "Release readiness: manual/scheduled release-static readiness plus screenshot-smoke, ui-smoke, release-build, and unsigned-archive-validation."
          } >> "$GITHUB_STEP_SUMMARY"

          for required in \
            "${{ needs.static-policy.result }}" \
            "${{ needs.workflow-lint.result }}" \
            "${{ needs.swiftlint.result }}" \
            "${{ needs.xcode-unit-tests.result }}" \
            "${{ needs.ui-smoke.result }}"; do
            if [ "$required" != "success" ]; then
              exit 1
            fi
          done
